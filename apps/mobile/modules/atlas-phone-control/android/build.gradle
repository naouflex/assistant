plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'com.naouflex.atlas.phonecontrol'
version = '0.1.0'

android {
  namespace 'com.naouflex.atlas.phonecontrol'
  defaultConfig {
    versionName '0.1.0'
  }
}

dependencies {
  // React Native ships this version; Gradle keeps one copy.
  implementation 'com.squareup.okhttp3:okhttp:4.12.0'
  // Deeper commands run as the shell user when the user has Shizuku started and allows Atlas.
  implementation 'dev.rikka.shizuku:api:13.1.5'
  implementation 'dev.rikka.shizuku:provider:13.1.5'
  testImplementation 'junit:junit:4.13.2'
  // The real parser: Android's own org.json is a stub in local unit tests.
  testImplementation 'org.json:json:20240303'
}
