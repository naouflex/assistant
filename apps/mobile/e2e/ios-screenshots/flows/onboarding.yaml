appId: com.naouflex.atlas.app
name: Onboarding
---
- runFlow:
    file: ../subflows/sign-in.yaml
    env:
      ATLAS_ACTIVE_EMAIL: ${ATLAS_SCREENSHOT_EMPTY_EMAIL}
- extendedWaitUntil:
    visible: "Personal|Tap \\+ to create a bot"
    timeout: 20000
- takeScreenshot: 01-empty-inbox
- openLink: "atlas:///artifacts"
- extendedWaitUntil:
    visible: "No artifacts yet|Artifacts"
    timeout: 15000
- takeScreenshot: 02-empty-artifacts
- openLink: "atlas:///"
- extendedWaitUntil:
    visible: "Create"
    timeout: 15000
- tapOn: "Create"
- tapOn: "New bot"
- extendedWaitUntil:
    visible: "What do you want me on first\\?"
    timeout: 30000
- takeScreenshot: 04-choice-card
- tapOn: "Day-to-day work"
- extendedWaitUntil:
    notVisible: "Inbox & email"
    timeout: 15000
- takeScreenshot: 05-choice-selected
