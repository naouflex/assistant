# Shared apps-prod edge: HTTPS stays on rechat-caddy (host 80/443).
# Atlas api/web join the external `web-edge` network; this stack's own Caddy
# only starts with `--profile atlas-caddy` and must not publish host ports.
services:
  postgres:
    mem_limit: 1g
  migrate:
    mem_limit: 768m
  api:
    mem_limit: ${ATLAS_API_MEMORY_LIMIT:-1g}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      ATLAS_LOCAL_DISABLE_THINKING: ${ATLAS_LOCAL_DISABLE_THINKING:-}
    networks:
      web-edge:
        aliases:
          - atlas-api
  worker:
    mem_limit: ${ATLAS_WORKER_MEMORY_LIMIT:-1g}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      ATLAS_LOCAL_DISABLE_THINKING: ${ATLAS_LOCAL_DISABLE_THINKING:-}
  web:
    networks:
      web-edge:
        aliases:
          - atlas-web
  caddy:
    profiles: ["atlas-caddy"]
    ports: !reset []

networks:
  web-edge:
    external: true
